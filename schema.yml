openapi: 3.0.3
info:
  title: LMS service API
  version: 0.1.5
  description: Online school platform
paths:
  /api/lms/courses/:
    get:
      operationId: lms_courses_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - lms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseList'
          description: ''
    post:
      operationId: lms_courses_create
      tags:
      - lms
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/lms/courses/{id}/:
    get:
      operationId: lms_courses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - lms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    put:
      operationId: lms_courses_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - lms
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    patch:
      operationId: lms_courses_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - lms
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    delete:
      operationId: lms_courses_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - lms
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/lms/courses/{id}/buy/:
    post:
      operationId: lms_courses_buy_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Payment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Payment'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/lms/courses/{id}/subscription/:
    post:
      operationId: lms_courses_subscription_create
      description: 'Processing course subscription: add or delete users subscription
        for specified course.'
      summary: lms_course_subscription
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unsubscribed'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscribed'
          description: ''
        '400':
          description: No response body
        '401':
          description: Authentication credentials were not provided.
  /api/lms/lessons/:
    get:
      operationId: lms_lessons_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - lms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLessonList'
          description: ''
  /api/lms/lessons/{id}/:
    get:
      operationId: lms_lessons_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
  /api/lms/lessons/{id}/delete/:
    delete:
      operationId: lms_lessons_delete_destroy
      description: Delete the specifies lesson.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lms
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Lesson successfully deleted.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: You do not have permission to perform this action.
        '404':
          description: No Lesson matches the given query.
  /api/lms/lessons/{id}/update/:
    put:
      operationId: lms_lessons_update_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lms
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Lesson'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Lesson'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
    patch:
      operationId: lms_lessons_update_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lms
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLesson'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLesson'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
  /api/lms/lessons/create/:
    post:
      operationId: lms_lessons_create_create
      tags:
      - lms
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Lesson'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Lesson'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
  /api/lms/payments/:
    get:
      operationId: lms_payments_list
      parameters:
      - in: query
        name: course
        schema:
          type: integer
      - in: query
        name: course__title
        schema:
          type: string
      - in: query
        name: lesson
        schema:
          type: integer
      - in: query
        name: lesson__title
        schema:
          type: string
      - in: query
        name: method
        schema:
          type: integer
          title: Способ оплаты
          enum:
          - 0
          - 1
        description: |-
          Выберите способ оплаты

          * `0` - наличные
          * `1` - перевод на счёт
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - lms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
  /api/lms/payments/{id}/:
    get:
      operationId: lms_payments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - lms
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/lms/payments/webhook/:
    post:
      operationId: lms_payments_webhook_create
      description: Handles incoming Stripe webhook events.
      summary: Stripe Webhook Listener
      tags:
      - Payment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeWebhook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StripeWebhook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StripeWebhook'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Webhook processed successfully.
        '400':
          description: Invalid payload or signature.
  /api/users/:
    get:
      operationId: users_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/users/{id}/:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/delete/:
    delete:
      operationId: users_delete_destroy
      description: Delete the specifies user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/users/{id}/update/:
    put:
      operationId: users_update_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
    patch:
      operationId: users_update_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserDetail'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
  /api/users/login/:
    post:
      operationId: users_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/users/register/:
    post:
      operationId: users_register_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/users/token/refresh/:
    post:
      operationId: users_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Course:
      type: object
      description: Serializer for Course model
      properties:
        id:
          type: integer
          readOnly: true
        lessons_count:
          type: integer
          readOnly: true
        lessons:
          type: array
          items:
            type: string
          readOnly: true
        subscription:
          type: boolean
          readOnly: true
        title:
          type: string
          title: Название курса
          description: Кажите название курса
          maxLength: 50
        preview_image:
          type: string
          format: uri
          nullable: true
          title: Обложка курса
          description: Загрузите изображение
        description:
          type: string
          nullable: true
          title: Описание курса
          description: Укажите описание курса
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Стоимость
        author:
          type: integer
          nullable: true
          title: Автор
      required:
      - id
      - lessons
      - lessons_count
      - subscription
      - title
    Lesson:
      type: object
      description: Serializer for Lesson model
      properties:
        id:
          type: integer
          readOnly: true
        video_link:
          type: string
        title:
          type: string
          title: Название урока
          description: Укажите название урока
          maxLength: 50
        description:
          type: string
          nullable: true
          title: Описание урока
          description: Укажите описание урока
        preview_image:
          type: string
          format: uri
          nullable: true
          title: Обложка урока
          description: Загрузите изображение
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Стоимость
        course:
          type: integer
          title: Курс
          description: Выберите курс
        author:
          type: integer
          nullable: true
          title: Автор
      required:
      - course
      - id
      - title
    MethodEnum:
      enum:
      - 0
      - 1
      type: integer
      description: |-
        * `0` - наличные
        * `1` - перевод на счёт
    PaginatedCourseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Course'
    PaginatedLessonList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
    PaginatedPaymentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedCourse:
      type: object
      description: Serializer for Course model
      properties:
        id:
          type: integer
          readOnly: true
        lessons_count:
          type: integer
          readOnly: true
        lessons:
          type: array
          items:
            type: string
          readOnly: true
        subscription:
          type: boolean
          readOnly: true
        title:
          type: string
          title: Название курса
          description: Кажите название курса
          maxLength: 50
        preview_image:
          type: string
          format: uri
          nullable: true
          title: Обложка курса
          description: Загрузите изображение
        description:
          type: string
          nullable: true
          title: Описание курса
          description: Укажите описание курса
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Стоимость
        author:
          type: integer
          nullable: true
          title: Автор
    PatchedLesson:
      type: object
      description: Serializer for Lesson model
      properties:
        id:
          type: integer
          readOnly: true
        video_link:
          type: string
        title:
          type: string
          title: Название урока
          description: Укажите название урока
          maxLength: 50
        description:
          type: string
          nullable: true
          title: Описание урока
          description: Укажите описание урока
        preview_image:
          type: string
          format: uri
          nullable: true
          title: Обложка урока
          description: Загрузите изображение
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Стоимость
        course:
          type: integer
          title: Курс
          description: Выберите курс
        author:
          type: integer
          nullable: true
          title: Автор
    PatchedUserDetail:
      type: object
      description: Serializer for User model
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Почта
          description: Укажите почту
          maxLength: 254
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          nullable: true
          title: Номер телефона
          description: Укажите номер телефона
          maxLength: 15
        city:
          type: string
          nullable: true
          title: Город
          description: Укажите город
          maxLength: 35
        avatar:
          type: string
          format: uri
          nullable: true
          title: Аватар
          description: Загрузите аватар
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
          readOnly: true
    Payment:
      type: object
      description: Serializer for Payment model
      properties:
        user:
          type: integer
          nullable: true
          title: Пользователь
          description: Выберите пользователя
        title:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        amount:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Сумма оплаты
          description: Укажите сумму оплаты
        course:
          type: integer
          nullable: true
          title: Курс
          description: Выберите курс
        lesson:
          type: integer
          nullable: true
          title: Урок
          description: Выберите урок
        method:
          allOf:
          - $ref: '#/components/schemas/MethodEnum'
          title: Способ оплаты
          description: |-
            Выберите способ оплаты

            * `0` - наличные
            * `1` - перевод на счёт
          minimum: 0
          maximum: 32767
        stripe_product_id:
          type: string
          nullable: true
          maxLength: 255
        stripe_price_id:
          type: string
          nullable: true
          maxLength: 255
        stripe_checkout_session:
          type: string
          nullable: true
          title: Stripe Checkout Session Id
          maxLength: 255
        stripe_checkout_url:
          type: string
          nullable: true
          title: Stripe Checkout Session url
          maxLength: 500
        status:
          type: boolean
          title: Payment status
      required:
      - date
      - title
    StripeWebhook:
      type: object
      properties:
        id:
