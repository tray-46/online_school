[project]
name = "online-school"
version = "0.1.0"
description = ""
authors = [
    {name = "tray",email = "at-box@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1,<7.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "django-filter (>=26.1,<27.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.2.0,<3.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "django-stubs (>=6.1.0,<7.0.0)",
    "djangorestframework-stubs (>=3.18.0,<4.0.0)"
]
dev = [
    "coverage (>=7.16.0,<8.0.0)"
]

[tool.black]
line-length=119
exclude='''
(
  /(
      \.git
  )/
)
'''

[tool.isort]
line_length = 119
profile = "black"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["^venv",]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"
