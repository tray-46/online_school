services:
  db:
    image: postgres:16.0
    container_name: lms-db
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    container_name: lms-redis-broker
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./
      dockerfile: ./docker/django/Dockerfile
    container_name: lms-drf
    volumes:
      - static_data:/app/static
    command:  bash -c "
                python manage.py collectstatic --no-input 
                && python manage.py migrate 
                && gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./
      dockerfile: ./docker/django/Dockerfile
    container_name: lms-celery-worker
    command: celery -A config worker --loglevel=INFO
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./
      dockerfile: ./docker/django/Dockerfile
    container_name: lms-celery-beat
    command: celery -A config beat --loglevel=INFO
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./
      dockerfile: ./docker/nginx/Dockerfile
    container_name: lms-nginx
    ports:
      - "80:80"
    volumes:
      - static_data:/app/static/:ro
    restart: unless-stopped

  adminer:
    image: adminer:6.1.0
    container_name: lms-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pg_data:
  redis_data:
  static_data: